spring.application.name=auth-service
server.port=8081

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/authdb}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Error handling
server.error.include-stacktrace=never

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl-minutes=15
app.jwt.refresh-ttl-days=7

# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Flyway : le schéma est géré par les migrations (db/migration), Hibernate ne fait que le vérifier.
# baseline : sur une base qui existait déjà (tables créées par Hibernate), V1 est marquée comme appliquée.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# US20 : événements de compte (COMPTE_SUPPRIME) publiés dans Kafka, topic dwadispo.comptes.
# false par défaut (tests) : les événements restent dans l'outbox account_events.
comptes.kafka.enabled=${COMPTES_KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=3000
