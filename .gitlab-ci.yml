# Pipeline CI DwaDispo : tests de chaque microservice + frontend (CDC §9.2)
image: maven:3.9-eclipse-temurin-21

# Le pipeline ne tourne que sur les Merge Requests, develop et main (économie de minutes).
# Un nouveau push annule l'ancien pipeline encore en cours.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

stages:
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"

# ---------- Modèles ----------

# Un seul job par service : "mvn test" compile ET teste. Cache Maven par service, partagé entre branches.
.backend:
  stage: test
  cache:
    key: "maven-$SERVICE"
    paths:
      - .m2/repository
  script:
    - mvn $MAVEN_CLI_OPTS -f $SERVICE/pom.xml test
  artifacts:
    when: always
    reports:
      junit: "**/target/surefire-reports/TEST-*.xml"

# Docker-in-Docker uniquement pour les services testés avec Testcontainers
.avec-docker:
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: "docker"

# ---------- Microservices ----------
# Sur develop/main : tout est testé. Dans une MR : seulement ce qui a changé.

eureka-server:
  extends: .backend
  variables:
    SERVICE: eureka-server
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [eureka-server/**/*, .gitlab-ci.yml]

api-gateway:
  extends: .backend
  variables:
    SERVICE: api-gateway
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [api-gateway/**/*, .gitlab-ci.yml]

auth-service:
  extends: [.backend, .avec-docker]
  variables:
    SERVICE: auth-service
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [auth-service/**/*, .gitlab-ci.yml]

pharmacy-service:
  extends: [.backend, .avec-docker]
  variables:
    SERVICE: pharmacy-service
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [pharmacy-service/**/*, .gitlab-ci.yml]

medication-service:
  extends: [.backend, .avec-docker]
  variables:
    SERVICE: medication-service
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [medication-service/**/*, .gitlab-ci.yml]

prescription-service:
  extends: .backend
  variables:
    SERVICE: prescription-service
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [prescription-service/**/*, .gitlab-ci.yml]

# ---------- Frontend : un seul npm ci, puis tests, puis build ----------

frontend:
  stage: test
  image: node:22
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files:
        - frontend/package-lock.json
      prefix: npm
    paths:
      - .npm
  script:
    - cd frontend
    - npm ci --prefer-offline --no-audit --no-fund
    - npx ng test --watch=false
    - npm run build
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [frontend/**/*, .gitlab-ci.yml]
