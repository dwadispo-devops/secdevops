spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# --- Routes ---
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webmvc.routes[1].id=pharmacy-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://pharmacy-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/pharmacies/**

spring.cloud.gateway.server.webmvc.routes[2].id=availability-requests
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://pharmacy-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/availability-requests,/api/availability-requests/**

# US06 / US07 : ordonnances (envoi, image, lecture IA)
spring.cloud.gateway.server.webmvc.routes[3].id=prescription-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://prescription-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/prescriptions,/api/v1/prescriptions/**

# US05 : catalogue des médicaments (medication-service n'est pas inscrit dans Eureka : adresse directe)
spring.cloud.gateway.server.webmvc.routes[4].id=medication-service
spring.cloud.gateway.server.webmvc.routes[4].uri=${MEDICATION_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/medications,/api/medications/**

# US14 : notifications (portées par pharmacy-service)
spring.cloud.gateway.server.webmvc.routes[5].id=notifications
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://pharmacy-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/notifications/**

# US22 : alertes de retour en stock
spring.cloud.gateway.server.webmvc.routes[6].id=stock-alerts
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://pharmacy-service
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/alertes,/api/alertes/**

# TS07 : documentation OpenAPI. SWAGGER_ENABLED=false la coupe (production). Routes internes jamais documentées.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.paths-to-exclude=/internal/**,/actuator/**

# TS07 : documentation de chaque service relayee par la gateway (/docs/<service>/v3/api-docs -> /v3/api-docs)
spring.cloud.gateway.server.webmvc.routes[7].id=docs-auth
spring.cloud.gateway.server.webmvc.routes[7].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[7].predicates[0]=Path=/docs/auth/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[7].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[8].id=docs-pharmacy
spring.cloud.gateway.server.webmvc.routes[8].uri=lb://pharmacy-service
spring.cloud.gateway.server.webmvc.routes[8].predicates[0]=Path=/docs/pharmacy/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[8].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[9].id=docs-prescription
spring.cloud.gateway.server.webmvc.routes[9].uri=lb://prescription-service
spring.cloud.gateway.server.webmvc.routes[9].predicates[0]=Path=/docs/prescription/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[9].filters[0]=StripPrefix=2
spring.cloud.gateway.server.webmvc.routes[10].id=docs-medication
spring.cloud.gateway.server.webmvc.routes[10].uri=${MEDICATION_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[10].predicates[0]=Path=/docs/medication/v3/api-docs
spring.cloud.gateway.server.webmvc.routes[10].filters[0]=StripPrefix=2

# TS07 : page Swagger unique de tous les services : http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.urls[0].name=Authentification (auth-service)
springdoc.swagger-ui.urls[0].url=/docs/auth/v3/api-docs
springdoc.swagger-ui.urls[1].name=Pharmacies (pharmacy-service)
springdoc.swagger-ui.urls[1].url=/docs/pharmacy/v3/api-docs
springdoc.swagger-ui.urls[2].name=Ordonnances (prescription-service)
springdoc.swagger-ui.urls[2].url=/docs/prescription/v3/api-docs
springdoc.swagger-ui.urls[3].name=Medicaments (medication-service)
springdoc.swagger-ui.urls[3].url=/docs/medication/v3/api-docs
springdoc.swagger-ui.urls-primary-name=Pharmacies (pharmacy-service)
