spring.application.name=api-gateway
server.port=8080
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# --- Routes ---
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.server.webmvc.routes[1].id=pharmacy-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://pharmacy-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/pharmacies/**

spring.cloud.gateway.server.webmvc.routes[2].id=availability-requests
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://pharmacy-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/availability-requests,/api/availability-requests/**

# US06 / US07 : ordonnances (envoi, image, lecture IA)
spring.cloud.gateway.server.webmvc.routes[3].id=prescription-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://prescription-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/prescriptions,/api/v1/prescriptions/**

# US05 : catalogue des médicaments (medication-service n'est pas inscrit dans Eureka : adresse directe)
spring.cloud.gateway.server.webmvc.routes[4].id=medication-service
spring.cloud.gateway.server.webmvc.routes[4].uri=${MEDICATION_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/medications,/api/medications/**

# US14 : notifications (portées par pharmacy-service)
spring.cloud.gateway.server.webmvc.routes[5].id=notifications
spring.cloud.gateway.server.webmvc.routes[5].uri=lb://pharmacy-service
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/notifications/**

# US22 : alertes de retour en stock
spring.cloud.gateway.server.webmvc.routes[6].id=stock-alerts
spring.cloud.gateway.server.webmvc.routes[6].uri=lb://pharmacy-service
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/api/alertes,/api/alertes/**
