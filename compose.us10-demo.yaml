name: medidispo-us10-review
services:
  db:
    image: postgis/postgis:16-3.5
    pull_policy: never
    env_file: .us10/demo.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports: ["127.0.0.1:5540:5432"]
    volumes:
      - demo-data:/var/lib/postgresql/data
      - ./scripts/us10-init.sql:/docker-entrypoint-initdb.d/us10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  auth:
    image: maven:3.9-eclipse-temurin-21
    pull_policy: never
    entrypoint: ["java", "-Xmx384m", "-jar", "/app/service.jar"]
    env_file: .us10/demo.env
    environment:
      DB_URL: jdbc:postgresql://db:5432/auth_us10
      EUREKA_CLIENT_ENABLED: "false"
    volumes: ["./auth-service/target/auth-service-0.0.1-SNAPSHOT.jar:/app/service.jar:ro"]
    ports: ["127.0.0.1:18081:8081"]
    depends_on:
      db: { condition: service_healthy }
  pharmacy:
    image: maven:3.9-eclipse-temurin-21
    pull_policy: never
    entrypoint: ["java", "-Xmx384m", "-jar", "/app/service.jar"]
    env_file: .us10/demo.env
    environment:
      DB_URL: jdbc:postgresql://db:5432/pharmacy_us10
      PRESCRIPTION_SERVICE_URL: http://prescription:8085
      EUREKA_CLIENT_ENABLED: "false"
    volumes: ["./pharmacy-service/target/pharmacy-service-0.0.1-SNAPSHOT.jar:/app/service.jar:ro"]
    ports: ["127.0.0.1:18082:8082"]
    depends_on:
      db: { condition: service_healthy }
  prescription:
    image: maven:3.9-eclipse-temurin-21
    pull_policy: never
    entrypoint: ["java", "-Xmx384m", "-jar", "/app/service.jar"]
    env_file: .us10/demo.env
    environment:
      DB_URL: jdbc:postgresql://db:5432/prescription_us10
      EUREKA_CLIENT_ENABLED: "false"
    volumes: ["./prescription-service/target/prescription-service-0.1.0-SNAPSHOT.jar:/app/service.jar:ro"]
    ports: ["127.0.0.1:18085:8085"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  demo-data:
