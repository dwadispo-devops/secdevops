<header class="topbar">
  <a class="brand" routerLink="/" aria-label="DwaDispo, accueil">
    <img src="logo-dwadispo.png" alt="DwaDispo" height="34" />
  </a>

  <nav aria-label="Navigation principale">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Accueil</a>

    @if (!connected()) {
      <a routerLink="/connexion" routerLinkActive="active">Connexion</a>
      <a routerLink="/inscription" routerLinkActive="active">Créer un compte</a>
    }

    @if (connected() && profile()?.role === 'PATIENT') {
      <a routerLink="/scan" routerLinkActive="active">Scanner</a>
      <a routerLink="/mes-ordonnances" routerLinkActive="active">Mes ordonnances</a>
      <a routerLink="/pharmacies" routerLinkActive="active">Pharmacies</a>
      <a routerLink="/garde" routerLinkActive="active">Gardes</a>
      <a routerLink="/medicaments" routerLinkActive="active">Médicaments</a>
      <a routerLink="/suivi-demande" routerLinkActive="active">Ma demande</a>
    }

    @if (connected() && profile()?.role === 'PHARMACIEN') {
      <a routerLink="/pharmacien/demandes" routerLinkActive="active">Demandes reçues</a>
      <a routerLink="/pharmacien/gardes" routerLinkActive="active">Mes gardes</a>
    }

    @if (connected()) {
      <a routerLink="/profil" routerLinkActive="active">Mon profil</a>
      <app-notification-bell />
      <button type="button" (click)="logout()">Déconnexion</button>
    }
  </nav>
</header>

<router-outlet />
