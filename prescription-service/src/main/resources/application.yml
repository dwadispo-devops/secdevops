server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: prescription-service
  config:
    # Charge le fichier .env local s'il existe (pratique en dev ; ignoré par Git)
    import: "optional:file:.env[.properties]"
  servlet:
    multipart:
      # RG05 : taille <= 5 Mo (la vérification fine est faite aussi dans FileValidator)
      max-file-size: 5MB
      max-request-size: 6MB

  # --- US06 : base de données (ordonnances + images chiffrées) ---
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/prescriptiondb}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate      # les tables sont créées par Flyway, Hibernate vérifie seulement
    open-in-view: false
  flyway:
    enabled: true

  ai:
    # Peu de nouvelles tentatives : si Gemini est surchargé (503), le patient est vite
    # redirigé vers la saisie manuelle au lieu d'attendre plusieurs minutes
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 4s
    model:
      # Modèle de chat actif : google-genai (Gemini, défaut) ou ollama (profil "ollama")
      chat: google-genai
      embedding: none
    google:
      genai:
        # Clé Google AI Studio, fournie par variable d'environnement (jamais dans le code)
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_MODEL:gemini-3.5-flash}
            temperature: 0.0
            # Raisonnement réduit : la lecture d'une ordonnance n'en a pas besoin (ENF02 : < 15 s)
            thinking-level: ${GEMINI_THINKING_LEVEL:LOW}
            # Réponse en JSON pur et place suffisante pour ne pas être coupée
            response-mime-type: application/json
            max-output-tokens: 4096

# --- US06 : JWT, même clé que auth-service ---
app:
  jwt:
    secret: ${JWT_SECRET}

prescription:
  reading:
    # Côté le plus long de l'image envoyée à l'IA (compromis lisibilité / temps de réponse)
    max-image-side: 1600
    # Protection contre les "bombes de décompression"
    max-pixels: 40000000
    max-lines: 25
  # US07 : catalogue CNOPS exposé par medication-service (GET /api/medications/search)
  catalog:
    base-url: ${MEDICATION_SERVICE_URL:http://localhost:8083}
    timeout: 3s
    candidates: 10
  # --- US06 : chiffrement des images (RG06). Générer : openssl rand -base64 32 ---
  storage:
    encryption-key: ${PRESCRIPTION_IMAGE_KEY}

# --- US06 : inscription dans Eureka (la Gateway route via lb://prescription-service) ---
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    ma.ensa.pharma: INFO

# --- US20 / loi 09-08 : effacement des ordonnances d'un compte supprimé (topic dwadispo.comptes) ---
# false par défaut (tests) ; activé dans docker-compose
comptes.kafka.enabled: ${COMPTES_KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset: earliest
