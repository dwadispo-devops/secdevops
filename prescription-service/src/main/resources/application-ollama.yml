# Plan B : modèle vision local via Ollama (aucune clé API, aucune image envoyée sur Internet)
# Lancer avec : SPRING_PROFILES_ACTIVE=ollama
spring:
  ai:
    model:
      chat: ollama
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5vl:7b}
          temperature: 0.0
