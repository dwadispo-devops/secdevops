
spring.application.name=pharmacy-service
server.port=8082

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Actuator
management.endpoints.web.exposure.include=health

# JWT : meme cle que Auth Service
app.jwt.secret=${JWT_SECRET}

# Eureka Client
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.jackson.deserialization.accept-float-as-int=false

# US10: direct server-to-server access; internal endpoints are not exposed by Gateway.
prescription.service-url=${PRESCRIPTION_SERVICE_URL:http://localhost:8085}

# US14 : e-mails de notification (boîte d'envoi, lots toutes les 30 s)
notifications.email.enabled=${NOTIFICATIONS_EMAIL_ENABLED:false}
notifications.email.from=${MAIL_FROM:no-reply@dwadispo.local}
app.front-url=${FRONT_URL:http://localhost:4200}
auth.service-url=${AUTH_SERVICE_URL:http://localhost:8081}
app.internal-token=${INTERNAL_API_TOKEN:}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
# l'indisponibilité du serveur e-mail ne doit pas rendre le service « DOWN » (outbox = envoi différé)
management.health.mail.enabled=false

# US14 – Notifications asynchrones avec Kafka
# false (par défaut) = traitement direct, comme avant (tests, environnement sans Kafka)
notifications.kafka.enabled=${NOTIFICATIONS_KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.consumer.auto-offset-reset=earliest

# US20 : effacement des données quand auth-service publie COMPTE_SUPPRIME (topic dwadispo.comptes)
comptes.kafka.enabled=${COMPTES_KAFKA_ENABLED:false}
